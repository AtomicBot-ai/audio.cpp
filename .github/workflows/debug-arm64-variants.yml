# Temporary: which ggml CPU variant makes speech go wrong on an arm64 runner. Removed once answered.
name: debug-arm64-variants
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Release (Atomic) run holding archive-linux-cpu-arm64
        required: true
permissions:
  contents: read
  actions: read
jobs:
  variants:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      MOSS_URL: https://huggingface.co/audio-cpp/audio.cpp-gguf/resolve/874fcb41ececda20bcbc0782d6b4ea7f7d069ea8/MOSS-TTS-Nano-100M-GGUF/moss-tts-nano-100m-q8_0.gguf
    steps:
      - name: CPU
        run: |
          lscpu | head -30
          grep -m1 Features /proc/cpuinfo
      - name: Archive and model
        run: |
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n archive-linux-cpu-arm64 -D /tmp/art
          mkdir /tmp/tree && unzip -q /tmp/art/*.zip -d /tmp/tree
          chmod +x /tmp/tree/audiocpp_server
          curl -sSfL -o /tmp/moss.gguf "$MOSS_URL"
      - name: Every variant, q8 and f16
        run: |
          cat > /tmp/seeds.py <<'EOF'
          import json, struct, sys, time, urllib.request
          port = sys.argv[1]
          text = "Hello from Atomic Chat. This is a smoke test."
          out = []
          for seed in range(1, 13):
              req = urllib.request.Request(f"http://127.0.0.1:{port}/v1/audio/speech",
                  json.dumps({"model": "moss", "input": text, "seed": seed}).encode(),
                  {"Content-Type": "application/json"})
              body = urllib.request.urlopen(req, timeout=300).read()
              rate, ch = struct.unpack("<IH", body[24:28] + body[22:24])
              i = body.find(b"data")
              out.append(struct.unpack("<I", body[i + 4:i + 8])[0] / (rate * ch * 2))
          s = sorted(out)
          print(" ".join(f"{x:.2f}" for x in out))
          print(f"  min {s[0]:.2f} median {s[6]:.2f} max {s[-1]:.2f}  outside 2..6 s: {sum(not 2 <= x <= 6 for x in s)}/12")
          EOF
          port=18800
          for variant in armv8.0_1 armv8.2_1 armv8.2_2 armv8.2_3 armv8.6_1 armv8.6_2; do
            d=/tmp/only-$variant; rm -rf "$d"; cp -r /tmp/tree "$d"
            find "$d" -name 'libggml-cpu-*.so' ! -name "libggml-cpu-$variant.so" -delete
            for weights in q8 f16; do
              port=$((port + 1))
              opts='{}'; [ "$weights" = f16 ] && opts='{"moss_tts_nano.weight_type":"f16"}'
              cat > "$d/server.json" <<EOF
          {"host":"127.0.0.1","port":$port,"backend":"cpu","lazy_load":false,"max_loaded_models":1,"idle_unload_ms":0,
           "models":[{"id":"moss","family":"moss_tts_nano","path":"/tmp/moss.gguf","task":"tts","mode":"offline","session_options":$opts}]}
          EOF
              (cd "$d" && LD_LIBRARY_PATH="$d" ./audiocpp_server --config server.json --no-ui --backend cpu > server.log 2>&1) &
              pid=$!
              for i in $(seq 1 120); do curl -sf -m 1 "http://127.0.0.1:$port/health" > /dev/null && break; sleep 0.5; done
              echo "=== $variant $weights: $(grep -m1 -o 'loaded CPU backend from .*' "$d/server.log" | sed 's#.*/##')"
              python3 /tmp/seeds.py "$port" || tail -5 "$d/server.log"
              kill "$pid"; wait "$pid" 2>/dev/null || true
            done
          done
